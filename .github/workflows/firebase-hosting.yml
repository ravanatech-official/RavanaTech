name: Deploy to Firebase Hosting & Rules

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      # Mode 1: Firebase Extended Action with Service Account (Official Google Action)
      - name: Deploy to Firebase Hosting via Service Account
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ravanatec

      # Deploy Firestore Security Rules alongside Hosting if Service Account is configured
      - name: Deploy Firestore Rules via Service Account
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC != '' || secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools deploy --only firestore:rules --project ravanatec

      # Mode 2: Firebase CLI Token Fallback (when FIREBASE_TOKEN secret is used)
      - name: Deploy via Firebase CLI Token
        if: "${{ (secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC == '' && secrets.FIREBASE_SERVICE_ACCOUNT == '') && secrets.FIREBASE_TOKEN != '' }}"
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --project ravanatec --token "${{ secrets.FIREBASE_TOKEN }}"

      # Helpful Diagnostic Guide if secrets are not configured in GitHub
      - name: Validate GitHub Secrets Configuration
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAVANATEC == '' && secrets.FIREBASE_SERVICE_ACCOUNT == '' && secrets.FIREBASE_TOKEN == '' }}"
        run: |
          echo "::error::No Firebase credentials found in GitHub Secrets!"
          echo "========================================================================"
          echo "HOW TO ACTIVATE AUTOMATIC DEPLOYMENT IN GITHUB REPOSITORY:"
          echo "Option 1 (Fastest - 1 Minute via CLI Token):"
          echo "1. On your terminal run: npx firebase login:ci"
          echo "2. Copy the token generated in the terminal output."
          echo "3. In GitHub: Settings -> Secrets and variables -> Actions -> New repository secret"
          echo "4. Name: FIREBASE_TOKEN | Value: <paste token>"
          echo ""
          echo "Option 2 (Google Recommended Service Account):"
          echo "1. Go to Firebase Console -> Project settings -> Service accounts -> Generate new private key"
          echo "2. In GitHub: Settings -> Secrets and variables -> Actions -> New repository secret"
          echo "3. Name: FIREBASE_SERVICE_ACCOUNT_RAVANATEC | Value: <paste entire JSON contents>"
          echo "========================================================================"
          exit 1
