<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting // RAVANA TECH</title>
    <script>
        // Single Page Apps for GitHub Pages
        // MIT License
        // This script takes the current URL and redirects with a query or hash so index.html can restore the route
        var pathSegmentsToKeep = 0;
        var l = window.location;
        var path = l.pathname.slice(1).split('/');
        // If repo name is the first segment (e.g. /my-repo/about), handle accordingly
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body style="background:#030712;color:#00BFFF;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div>TRANSMITTING ROUTE DATA TO RAVANA TECH DECK...</div>
</body>
</html>
