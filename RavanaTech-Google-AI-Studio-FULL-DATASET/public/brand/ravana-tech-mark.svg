<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </radialGradient>
    
    <!-- Electric Cyan Gradient for T -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- White / Silver Facet Gradient for R -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="rtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>
  <rect width="118" height="118" x="1" y="1" rx="25" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Logo Mark Graphic -->
  <g transform="translate(18, 22)" filter="url(#rtGlow)">
    <!-- Blue 'T' Segment (Right & Upper) -->
    <path d="M 40 8 L 82 8 L 74 24 L 40 24 Z" fill="url(#cyanGrad)"/>
    <path d="M 46 24 L 62 24 L 62 66 L 46 54 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <polygon points="62,24 74,24 62,40" fill="#38bdf8"/>

    <!-- White Geometric 'R' Segment (Left & Foreground) -->
    <path d="M 6 8 L 26 8 L 18 68 L 6 68 Z" fill="url(#whiteGrad)"/>
    <path d="M 18 8 L 46 8 C 54 8 58 14 56 24 C 54 34 46 40 36 40 L 22 40 L 24 24 L 34 24 C 38 24 40 22 41 18 C 42 14 39 12 34 12 L 17 12 Z" fill="url(#whiteGrad)"/>
    <path d="M 28 36 L 44 36 L 54 68 L 36 68 L 28 44 Z" fill="url(#whiteGrad)"/>
  </g>
</svg>
